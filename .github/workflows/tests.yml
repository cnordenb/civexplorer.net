name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Get the code
        run: |
          git init --quiet .
          git fetch --quiet --depth=1 \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "${{ github.sha }}"
          git checkout --quiet FETCH_HEAD
      - name: Check that the repository holds only the allowed files
        run: |
          extra="$(git ls-files | grep -vxE \
            -e 'index\.html|data\.json|favicon\.ico|README\.md|LICENSE|\.assetsignore|\.gitignore|\.github/.*' \
            -e '\.well-known/discord|css/[a-z]+\.css|js/(script|(model|view|controller)/([a-z]+/)?[a-z]+)\.js' \
            -e 'js/tests/([a-z]+/)?[a-z]+_test\.js' \
            -e 'locales/[a-z]+\.json' \
            -e 'documentation/[A-Za-z_]+\.(md|pdf)|documentation/DEVLOG/DEVLOG[1-9][0-9]*\.md' \
            -e 'assets/images/([a-z0-9]+/)*[a-z0-9_]+\.(webp|png)|assets/images/icons/nodes/colour_key\.csv' \
            -e 'assets/images/preview\.jpg|assets/fonts/[A-Za-z0-9-]+\.ttf' \
            -e '\.claude/skills/package\.json|\.claude/skills/[a-z-]+/[A-Za-z]+\.(md|json)' \
            -e '\.claude/skills/[a-z-]+/(desc|references|scripts)/[a-z0-9]+\.[a-z]+' \
            || true)"
          if [ -n "$extra" ]; then
            echo "These files are not allowed by the project's rules:"
            echo "$extra"
            exit 1
          fi
      - name: Run the tests in Chrome over http and file, in light and dark colours and at several window sizes
        run: bash .github/runtests.sh
      - name: Check that no folder holds more than 7 files, the main folder 8, apart from assets and locales
        if: always()
        run: |
          crowded="$(git ls-files | grep -vE '^(assets|locales)/' | sed -E 's#/[^/]+$##; t; s#.*#.#' | sort \
            | uniq -c | awk '$1 > ($2 == "." ? 8 : 7) { print ($2 == "." ? "the main folder" : $2) ": " $1 " files" }')"
          if [ -n "$crowded" ]; then
            echo "These folders hold too many files (7 at most, 8 in the main folder):"
            echo "$crowded"
            exit 1
          fi
